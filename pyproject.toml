[project]
name = "cc-switch"
version = "0.9.11"
description = "Generate ~/.claude/settings.json from saved provider/model configs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
requires-python = ">=3.13"
dependencies = [
    "credstore>=0.10.4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/juzcn/cc-switch"
Repository = "https://github.com/juzcn/cc-switch"
Documentation = "https://github.com/juzcn/cc-switch/blob/main/README.md"
Changelog = "https://github.com/juzcn/cc-switch/releases"

[project.scripts]
cc-switch = "cc_switch.cli:main"

[build-system]
# Pin below hatchling 1.27 so the wheel stays at Metadata-Version 2.3 —
# twine rejects 2.5 before 7.0.  Lifting this requires raising the twine
# floor in .github/workflows/publish.yml to >=7 in the same change.
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cc_switch"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
# README code fences hold illustrative snippets, not code this repo runs —
# leave them alone so doc edits never show up as formatting churn.
exclude = ["*.md"]

[tool.pyright]
include = ["cc_switch", "tests"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers --strict-config --no-header --color=yes --durations=10"
markers = [
    "asyncio: mark a test as an async test",
    "slow: mark a test as slow (excluded from quick runs with -m 'not slow')",
    "unit: fast, isolated unit test (no I/O, no subprocess)",
    "integration: test requiring I/O, network, or subprocess",
    "e2e: end-to-end test requiring a full running system",
]
